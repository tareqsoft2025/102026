<style>

  }

  .ck { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .yn { display: flex; gap: 6px; } .yn label { position: relative; } .yn input { position: absolute; opacity: 0; inset: 0; }

  /* ===== v3: instrument-panel theme. Midnight rail, mist canvas, saffron accent, gauge as the signature. ===== */
  :root {
    --pine: #0b6171; --pine-2: #094e5b; --brass: #f2a516; --brass-soft: #fdf0d0;
    --paper: #eceff4; --card: #fff; --ink: #0f1b2d; --muted: #5d697c; --line: #dde3ec;
    --rail: #0d1a2b; --rail-2: #17283f; --rail-fg: #a9bad0;
    --font: "Readex Pro", "Segoe UI", Tahoma, sans-serif; --display: "El Messiri", "Readex Pro", "Segoe UI", Tahoma, sans-serif;
    --shadow: 0 1px 2px rgba(15,27,45,.05), 0 12px 32px rgba(15,27,45,.07);
  }
  html { background: var(--paper); }
  body { font-family: var(--font); font-size: 15px; background: var(--paper); position: relative; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset-block-start: -300px; inset-inline-start: -220px; width: 760px; height: 760px; border-radius: 50%; pointer-events: none; z-index: 0;
    background: repeating-radial-gradient(circle, transparent 0 40px, rgba(11,97,113,.07) 40px 42px); }
  button, input, select, textarea { font-family: var(--font); }
  svg text { font-family: var(--font); }
  h1, h2, h3, .big, .kpi b, .mh b, .rail .org b { font-family: var(--display); }

  .app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; position: relative; z-index: 1; }
  .rail { position: sticky; top: 12px; height: calc(100vh - 24px); margin: 12px; margin-inline-end: 0; padding: 20px 14px 14px; border-radius: 24px; background: var(--rail); color: var(--rail-fg); display: flex; flex-direction: column; gap: 20px; overflow-y: auto; scrollbar-width: none; }
  .rail .org { display: flex; align-items: center; gap: 12px; padding-inline: 6px; color: #fff; }
  .rail .emblem { width: 40px; height: 40px; flex: none; }
  .rail .emblem circle:first-child { stroke: var(--brass); } .rail .emblem g { stroke: #fff; }
  .rail .org b { display: block; font-size: 19px; font-weight: 700; line-height: 1.2; } .rail .org small { display: block; font-size: 12px; color: var(--rail-fg); }
  .navv { display: grid; gap: 4px; }

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var fmtDay = function (iso) { return new Date(iso + 'T00:00:00').toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }); };
  var fmtDt = function (t) { return t ? new Date(t).toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; };
  var toastT; function toast(m) { $('#toastTxt').textContent = m; $('#toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { $('#toast').classList.remove('on'); }, 3000); }

  var STATUS = { none: ['لم يبدأ', 'p-none'], draft: ['مسودة', 'p-draft'], submitted: ['بانتظار إقرار الموظف', 'p-sub'], acknowledged: ['مكتمل', 'p-ack'] };
  function stOf(ev) { return ev ? ev.status : 'none'; }
  function isDone(ev) { return ev && (ev.status === 'submitted' || ev.status === 'acknowledged'); }
  function pill(st) { return '<span class="pill ' + STATUS[st][1] + '">' + STATUS[st][0] + '</span>'; }
  function bandTag(p) { var b = bandOf(p); return '<span class="band" style="--c:' + b.color + '">' + b.label + '</span>'; }
  function pctOf(ev) { return ev.pct != null ? ev.pct : Eval.calc(ev); }
  function mean(a) { return a.length ? Math.round(a.reduce(function (s, x) { return s + x; }, 0) / a.length * 10) / 10 : null; }
  function initial(n) { return (n || '؟').trim().charAt(0); }

  var me, route, selCycle = null, flt = { status: '', dept: '', q: '' };

  /* ---------------- boot ---------------- */
  loadDb();
  Auth.seed().then(function () {
    var cur = currentSession();
    if (!cur) { location.replace('index.html'); return; }
    me = cur.user; me.role = me.role || 'employee';
    selCycle = Eval.openCycle().id;
    $('#meAv').textContent = initial(me.name); $('#meName').textContent = me.name; $('#meRole').textContent = ROLES[me.role];
    window.addEventListener('hashchange', go); go();
  });
  $$('[data-logout]').forEach(function (b) { b.onclick = function () { Auth.logout(); location.replace('index.html'); }; });

  var ICONS = {
    dashboard: '<path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4-4"/><circle cx="12" cy="15" r="1.3"/>',
    evals: '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 13l2 2 4-4"/>',
    people: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.5a5 5 0 0 1 5 5"/>',
    calib: '<path d="M12 4v16M6 20h12M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/>',
    cycles: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    criteria: '<path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>',
    methods: '<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 4v13"/>',
    tasks: '<path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>',
    me: '<path d="M12 4l2.4 5 5.6.8-4 4 1 5.6-5-2.7-5 2.7 1-5.6-4-4 5.6-.8z"/>'
  };
  var NAVS = {
    admin: [['dashboard', 'المؤشرات'], ['evals', 'التقييمات'], ['people', 'الموظفون'], ['calib', 'المعايرة والترتيب'], ['cycles', 'الدورات'], ['criteria', 'المعايير'], ['methods', 'طرق التقييم']],
    manager: [['dashboard', 'مؤشرات الفريق'], ['evals', 'تقييمات الفريق'], ['people', 'الفريق'], ['calib', 'المعايرة والترتيب'], ['tasks', 'مهامي'], ['me', 'تقييماتي']],
    employee: [['me', 'تقييماتي'], ['tasks', 'مهامي']]
  };
  function go() {
    var items = NAVS[me.role] || NAVS.employee, h = location.hash.replace('#', '');
    route = items.filter(function (i) { return i[0] === h; })[0] ? h : items[0][0];
    $('#nav').innerHTML = items.map(function (i) { return '<a href="#' + i[0] + '"' + (i[0] === route ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[i[0]] || '') + '</svg><span class="lb">' + i[1] + '</span></a>'; }).join('');
    render(); updateBadge();
  }
  function render() { ({ dashboard: vDash, evals: vEvals, people: vPeople, cycles: vCycles, criteria: vCriteria, me: vMe, tasks: vTasks, calib: vCalib, methods: vMethods })[route](); animateGauges(); }

  /* ---------------- shared pieces ---------------- */
  function cycleSelect(id) {
    return '<select id="' + id + '" aria-label="الدورة">' + db.cycles.slice().reverse().map(function (c) { return '<option value="' + c.id + '"' + (c.id === selCycle ? ' selected' : '') + '>' + esc(c.name) + (c.status === 'closed' ? ' (مغلقة)' : '') + '</option>'; }).join('') + '</select>';
  }
  function rowsFor(cycleId) { return Eval.evaluable(me).map(function (e) { return { e: e, ev: Eval.find(cycleId, e.id) }; }); }
  function mgrName(u) { var m = u.managerId && Eval.user(u.managerId); return m ? m.name : '—'; }
  function actBtn(r, cyc) {
    var st = stOf(r.ev), can = Eval.canEvaluate(me, r.e);
    if (can && cyc.status === 'open' && (st === 'none' || st === 'draft')) return '<button class="btn btn-primary btn-sm" data-act="eval" data-c="' + cyc.id + '" data-e="' + r.e.id + '">' + (st === 'none' ? 'بدء التقييم' : 'متابعة') + '</button>';
    if (isDone(r.ev)) return '<button class="btn btn-quiet btn-sm" data-act="eval" data-c="' + cyc.id + '" data-e="' + r.e.id + '">عرض</button>';
    return '<span class="s" style="color:var(--muted);font-size:13px">—</span>';
  }

  /* ---------------- dashboard ---------------- */
  function vDash() {
    var cyc = Eval.cycle(selCycle), rows = rowsFor(selCycle), done = rows.filter(function (r) { return isDone(r.ev); });
    var avg = mean(done.map(function (r) { return pctOf(r.ev); }));
    var todo = rows.filter(function (r) { return !isDone(r.ev); }), waiting = rows.filter(function (r) { return stOf(r.ev) === 'submitted'; }).length;
    var comp = rows.length ? Math.round(done.length / rows.length * 100) : 0;
    var dist = BANDS.map(function (b) { return { b: b, n: done.filter(function (r) { return bandOf(pctOf(r.ev)) === b; }).length }; });
    var depts = {}; done.forEach(function (r) { (depts[r.e.dept || 'غير محدد'] = depts[r.e.dept || 'غير محدد'] || []).push(pctOf(r.ev)); });
    var dl = Object.keys(depts).map(function (d) { return { d: d, a: mean(depts[d]), n: depts[d].length }; }).sort(function (x, y) { return y.a - x.a; });
    var top = done.slice().sort(function (a, b) { return pctOf(b.ev) - pctOf(a.ev); }).slice(0, 3);
    $('#view').innerHTML =
      '<div class="head"><div><h1>' + (me.role === 'admin' ? 'مؤشرات الأداء' : 'مؤشرات الفريق') + '</h1><p class="sub">' + esc(cyc.name) + ' · من ' + fmtDay(cyc.start) + ' إلى ' + fmtDay(cyc.end) + '</p></div><div class="tools">' + cycleSelect('selCycle') + '</div></div>' +
      '<div class="hero-row"><section class="panel gauge-card"><h2>متوسط الأداء</h2><div class="pb gauge">' + gaugeSvg(avg) + '<div class="gl">' + (avg == null ? 'لا توجد نتائج بعد' : bandOf(avg).label + ' · ' + done.length + ' تقييم معتمد') + '</div></div></section><div class="kpis">' +

  function openCycDlg(cid) {
    editCyc = cid || null; var c = cid ? Eval.cycle(cid) : null;
    $('#cMain').hidden = !!cid; $('#cycTitle').textContent = cid ? 'طرق التقييم: ' + c.name : 'دورة تقييم جديدة'; $('#cSubmit').textContent = cid ? 'حفظ الطرق' : 'إنشاء الدورة';
    $('#cName').value = ''; $('#cStart').value = ''; $('#cEnd').value = ''; $('#cErr').textContent = '';
    $('#cMethods').innerHTML = methodsFormHtml(c && c.methods ? c.methods : defaultMethods()); mTotal(); $('#cycDlg').showModal();
  }

  function ancHtml(c, i) {
    var a = c.anchors || ['', '', '', '', ''];
    return '<details style="grid-column:1/-1"><summary class="link">أوصاف السلوك لكل درجة (BARS)</summary><div class="frm" style="margin-top:8px">' + [0, 1, 2, 3, 4].map(function (k) { return '<div><label class="l" for="an' + i + '_' + k + '">درجة ' + (k + 1) + ' · ' + SCALE[k] + '</label><input id="an' + i + '_' + k + '" type="text" data-ci="' + i + '" data-f="anc' + k + '" value="' + esc(a[k] || '') + '"></div>'; }).join('') + '</div></details>';
  }

  /* ---------------- export ---------------- */
  function exportCsv() {
    var cyc = Eval.cycle(selCycle), head = ['الموظف', 'القسم', 'المسمى', 'المقيّم', 'الحالة', 'النتيجة %', 'التقدير'].concat(db.criteria.map(function (c) { return c.name; }));
    var lines = [head].concat(rowsFor(selCycle).map(function (r) {
      var d = isDone(r.ev), p = d ? pctOf(r.ev) : '';
      return [r.e.name, r.e.dept || '', r.e.title || '', mgrName(r.e), STATUS[stOf(r.ev)][0], p, d ? bandOf(p).label : ''].concat(db.criteria.map(function (c) { return r.ev && r.ev.scores[c.id] || ''; }));
    }));
    var csv = '﻿' + lines.map(function (l) { return l.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'evaluations-' + cyc.name.replace(/\s+/g, '-') + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------------- actions ---------------- */
  var actions = {
    'eval': function (t) { $$('dialog[open]').forEach(function (d) { if (d.id !== 'evDlg') d.close(); }); openEval(t.dataset.c, t.dataset.e); },
    'profile': function (t) { openProfile(t.dataset.e); },
    'person-new': function () { openPerson(null); },
    'person-edit': function (t) { openPerson(t.dataset.e); },
    'cycle-new': function () { openCycDlg(null); },
    'cycle-methods': function (t) { openCycDlg(t.dataset.c); },
    'cycle-toggle': function (t) { var c = Eval.cycle(t.dataset.c); Eval.setCycleStatus(c.id, c.status === 'open' ? 'closed' : 'open', me); toast(c.status === 'open' ? 'تم فتح الدورة.' : 'تم إغلاق الدورة.'); vCycles(); },
    'export': exportCsv,
    'rater': function (t) { openRater(t.dataset.id); },
    'req360': function () { openReq(); },
    'goal-add': function (t) { var k = t.dataset.k; curEv.ev.goals.push({ id: 'g' + Date.now().toString(36), kind: k, title: '', weight: 0, unit: '', target: '', actual: '', dir: 'up', krs: k === 'okr' ? [{ t: '', p: '' }, { t: '', p: '' }] : [], p: '' }); renderGoals(); },
    'goal-del': function (t) { curEv.ev.goals.splice(+t.dataset.i, 1); renderGoals(); },
    'kr-add': function (t) { curEv.ev.goals[+t.dataset.i].krs.push({ t: '', p: '' }); renderGoals(); },
    'kr-del': function (t) { curEv.ev.goals[+t.dataset.i].krs.splice(+t.dataset.j, 1); renderGoals(); },
    'pair': function (t) { var cur = (db.pairs[selCycle + '::' + pairMgr] || {})[Eval.pairKey(t.dataset.a, t.dataset.b)]; Eval.setPair(selCycle, pairMgr, t.dataset.a, t.dataset.b, cur === t.dataset.w ? null : t.dataset.w); fillPairs(); },
    'note-add': function (t) { var tx = $('#ntText').value.trim(); if (tx.length < 3) { $('#ntErr').textContent = 'اكتب نص الواقعة أو ملخص اللقاء.'; return; } Eval.addNote({ employeeId: t.dataset.e, type: $('#ntType').value, date: $('#ntDate').value, text: tx }, me); openProfile(t.dataset.e); toast('تمت الإضافة.'); },
    'crit-add': function () { critDraft.push({ id: 'c' + Date.now().toString(36), name: 'معيار جديد', desc: '', weight: 1 }); vCriteria(); },
    'crit-del': function (t) { critDraft.splice(+t.dataset.i, 1); vCriteria(); },
    'crit-save': function () {
      var bad = critDraft.some(function (c) { return !c.name.trim() || c.weight < 1; });
      if (bad) { toast('لكل معيار اسم ووزن لا يقل عن 1%.'); return; }
      if (Eval.setCriteria(critDraft.map(function (c) { return { id: c.id, name: c.name.trim(), desc: c.desc.trim(), weight: c.weight, anchors: c.anchors }; }), me)) { toast('تم حفظ المعايير.'); critDraft = null; vCriteria(); }
    },
    'ev-save': function () { var d = collect(); Eval.saveDraft(d, me); curEv.ev = d; toast('تم حفظ المسودة.'); $('#evDlg').close(); render(); },
    'ev-submit': function (t) {
      var d = collect(), msg = Eval.validateSubmit(d), err = $('#evErr');
      if (msg) { showTab('sum'); err.textContent = msg; armed = null; t.textContent = 'اعتماد التقييم وإرساله'; return; }
      err.textContent = '';
      if (armed !== 'submit') { armed = 'submit'; t.textContent = 'اضغط مرة أخرى للاعتماد النهائي'; return; }
      Eval.submit(d, me); $('#evDlg').close(); toast('تم اعتماد التقييم وإرساله إلى الموظف.'); render();
    },
    'ev-delete': function (t) {
      var real = Eval.find(curEv.cyc.id, curEv.emp.id);
      if (!real) return;
      if (armed !== 'delete') { armed = 'delete'; t.textContent = 'اضغط مرة أخرى للحذف النهائي'; t.style.background = 'var(--danger-soft)'; return; }
      Eval.remove(real, me); $('#evDlg').close(); toast('تم حذف التقييم.'); render();
    },
    'ev-ack': function () { Eval.acknowledge(curEv.ev, me, ($('#ackTxt') || {}).value ? $('#ackTxt').value.trim() : ''); $('#evDlg').close(); toast('تم تسجيل إقرارك بالاطلاع.'); render(); },
    'ev-reopen': function (t) {
      if (armed !== 'reopen') { armed = 'reopen'; t.textContent = 'اضغط مرة أخرى لإعادة الفتح'; return; }
      Eval.reopen(curEv.ev, me); $('#evDlg').close(); toast('أُعيد التقييم إلى مسودة.'); render();
    }
  };
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-close]'); if (c) { var d = c.closest('dialog'); if (d) d.close(); return; }
    var t = e.target.closest('[data-act]'); if (t && actions[t.dataset.act]) actions[t.dataset.act](t, e);
  });
  $$('dialog').forEach(function (d) { d.addEventListener('click', function (e) { if (e.target === d) d.close(); }); });
})();
</script>
</body>
</html>
